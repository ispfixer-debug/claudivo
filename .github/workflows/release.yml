name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Build release APKs
        run: ./gradlew assembleRelease
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          STRIPE_PUBLISHABLE: ${{ secrets.STRIPE_PUBLISHABLE }}
      - name: Upload to CDN
        run: |
          curl -fsSL -X PUT "https://cdn.vito.app/vito_client.apk" -H "Authorization: Bearer ${{ secrets.CDN_TOKEN }}" --data-binary "@vito_client/build/outputs/apk/release/vito_client-release.apk"

